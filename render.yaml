# Despliegue de la demo en Render (https://render.com): un servicio web y una base PostgreSQL,
# ambos en el plan gratuito. En Render: New → Blueprint → elegir este repositorio.
# El desarrollo y la entrega siguen siendo con Docker Compose; ver README.

databases:
  - name: cotiza-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"

services:
  - type: web
    name: cotiza
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cotiza-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # El disco del plan gratuito se borra en cada reinicio; los PDF se regeneran al descargarlos.
      - key: STORAGE_DIR
        value: /tmp/storage
      # Carga el escenario de demo en el primer arranque.
      - key: LOAD_DEMO
        value: "true"
