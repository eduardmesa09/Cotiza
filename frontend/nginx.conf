server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # La API se publica bajo el mismo origen: evita CORS y simplifica el frontend.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Aplicación de una sola página: cualquier otra ruta la resuelve React.
    location / {
        try_files $uri /index.html;
    }
}
