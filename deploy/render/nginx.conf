# Igual que frontend/nginx.conf, pero con la API en el mismo contenedor y el puerto que asigna Render.
server {
    listen __PORT__;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
